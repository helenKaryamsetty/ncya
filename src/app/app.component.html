<div class="sparkle-field" aria-hidden="true">

    class="spark"
    *ngFor="let s of sparks"
    [style.--x.%]="s.x"

    [style.--c]="s.c"
    [style.--dur]="s.dur"

    [style.--peak]="s.peak"

</div>
