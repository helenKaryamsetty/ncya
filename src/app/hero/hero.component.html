<header class="site-header">
  <a class="brand" href="#home" aria-label="NCYA home">
    <img class="brand-logo" src="/assets/NCYA-logo-transparent.png" alt="NCYA, New City Young Adults" width="220" height="85">
  </a>
  <nav id="main-nav" aria-label="Main navigation" [class.open]="menuOpen()">
    <a href="#about" (click)="closeMenu()">Our community</a>
    <a href="#nights" (click)="closeMenu()">NCYA Nights</a>
    <a href="#connect" (click)="closeMenu()">Connect</a>
    <a class="nav-cta-mobile" href="#connect" (click)="closeMenu()">Come say hello <span aria-hidden="true">↗</span></a>
  </nav>
  <a class="header-cta" href="#connect">Come say hello <span aria-hidden="true">↗</span></a>
  <button
    type="button"
    class="menu-toggle"
    [class.open]="menuOpen()"
    aria-controls="main-nav"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>
</header>

<section class="hero" id="home" aria-labelledby="hero-title">
  <div class="hero-image"></div>
  <div class="hero-content wrap">
    <p class="eyebrow hero-in"><span></span> NEW CITY YOUNG ADULTS <span></span></p>
    <h1 id="hero-title" class="hero-in hero-in-2">GOOD PEOPLE.<br><em>GOOD PURPOSE.</em><br>GOOD TOGETHER.</h1>
    <p class="hero-copy hero-in hero-in-3">A little more life, a lot more community.<br>There’s a place for you here.</p>
    <div class="hero-actions hero-in hero-in-4">
      <a class="button button-pink" href="#connect" (click)="burstConfetti($event)">Find your people <span>↗</span></a>
      <a class="button button-outline" href="#nights">See what’s happening <span>↓</span></a>
    </div>
  </div>
  <div class="hero-bottom wrap">
    <span>FAITH. FRIENDS. REAL LIFE.</span>
    <span>SCROLL TO EXPLORE ↓</span>
  </div>
</section>
